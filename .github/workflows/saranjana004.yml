name: Build and render Saranjana 004

on:
  workflow_dispatch:
  push:
    branches:
      - bang-stick/production-setup
    paths:
      - "src/videos/saranjana004/**"
      - "src/Root.tsx"
      - "scripts/render-saranjana004.mjs"
      - "package.json"
      - ".github/workflows/saranjana004.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project dependencies
        run: npm install

      - name: Build Remotion bundle
        run: npm run build

      - name: Render Saranjana 004
        run: npm run render:saranjana004
        env:
          REMOTION_CONCURRENCY: 2

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: Bang-Stick-Saranjana-004
          path: out/bang-stick/Saranjana_004.mp4
          if-no-files-found: error
          retention-days: 7
