name: Build and render Saranjana 004

on:
  workflow_dispatch:
  push:
    branches:
      - bang-stick/production-setup
    paths:
      - "src/videos/saranjana004/**"
      - "src/Root.tsx"
      - "scripts/render-saranjana004.mjs"
      - "package.json"
      - ".github/workflows/saranjana004.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install project dependencies
        run: npm install

      - name: Generate Indonesian narration
        run: |
          mkdir -p public
          espeak-ng -v id -s 118 -p 42 -a 165 -w /tmp/saranjana-voice.wav "Bayangkan... di Indonesia katanya ada sebuah kota yang lebih modern dari Jakarta! Namanya... Saranjana! Konon, kota ini berada di Kalimantan Selatan, tepatnya di wilayah Pulau Laut. Menurut cerita masyarakat, Saranjana memiliki gedung-gedung megah, jalanan luas, bahkan teknologi yang sangat maju! Anehnya, kota ini tidak pernah ditemukan seperti kota pada umumnya. Bahkan, ada cerita tentang orang-orang yang mengaku pernah melihat kota misterius ini! Tapi... apakah Saranjana benar-benar ada? Atau semuanya hanyalah legenda yang diwariskan turun-temurun? Menurut kalian... mistis atau sains?"
          ffmpeg -y -i /tmp/saranjana-voice.wav -af "atempo=0.90,apad=pad_dur=55" -t 55 -ar 48000 -ac 2 public/saranjana004-narration.wav

      - name: Build Remotion bundle
        run: npm run build

      - name: Render Saranjana 004
        run: npm run render:saranjana004
        env:
          REMOTION_CONCURRENCY: 2

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: Bang-Stick-Saranjana-004
          path: out/bang-stick/Saranjana_004.mp4
          if-no-files-found: error
          retention-days: 7
