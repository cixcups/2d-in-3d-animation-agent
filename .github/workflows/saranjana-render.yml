name: Render Saranjana004 MP4

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/saranjana-render.yml"
      - "src/Root.tsx"
      - "src/videos/saranjana/**"
      - "package.json"

permissions:
  contents: read

jobs:
  render:
    name: Render vertical MP4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libxshmfence1 libxss1 libxtst6

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render Saranjana004
        run: |
          npx remotion render src/index.ts Saranjana004 out/Saranjana004.mp4 --codec=h264 --crf=18 --concurrency=2 --gl=angle
          test -s out/Saranjana004.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate,codec_name -of json out/Saranjana004.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saranjana004-MP4
          path: out/Saranjana004.mp4
          if-no-files-found: error
          retention-days: 7
