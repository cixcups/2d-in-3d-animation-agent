name: Bang Stick Saranjana 004 — Build Check

on:
  push:
    branches:
      - bang-stick/production-setup
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/saranjana004-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remotion-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle Remotion compositions
        run: npm run build
