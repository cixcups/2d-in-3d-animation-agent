name: Render Saranjana004 True 3D
on:
  push:
    branches: [saranjana004-true-3d]
  workflow_dispatch:
concurrency:
  group: saranjana004-true-3d-render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender ffmpeg libegl1 libgl1
      - name: Render true 3D animation
        run: blender -b -t 2 --python scripts/saranjana004_true3d.py
      - name: Encode PNG frames to MP4
        run: |
          ffmpeg -y -framerate 12 -pattern_type glob -i '/tmp/saranjana_frames/frame_*.png' -vf fps=24 -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p -movflags +faststart /tmp/Saranjana004-3D.mp4
          test -s /tmp/Saranjana004-3D.mp4
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: Saranjana004-TRUE-3D-MP4
          path: /tmp/Saranjana004-3D.mp4
          if-no-files-found: error
          retention-days: 7
